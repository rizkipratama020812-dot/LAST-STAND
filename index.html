<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a1022">
<meta name="mobile-web-app-capable" content="yes">
<title>LAST STAND: WAVE DEFENSE</title>
<link rel="icon" href="assets/ui/crown.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <canvas id="cv" width="640" height="360"></canvas>
  <div id="hud"></div>
  <div id="screens"></div>
  <div id="loading"><div class="ltitle">LAST STAND</div><div class="lbar"><i id="lfill"></i></div><div id="ltxt">Memuat aset…</div></div>
</div>
<div id="rotate">Putar HP ke mode <b>landscape</b> untuk pengalaman terbaik</div>
<button id="landscapeBtn" onclick="toggleLandscape()">
  <svg id="landscapeIcon" viewBox="0 0 24 24" fill="none">
    <rect x="3" y="6" width="18" height="12" rx="2"
      stroke="currentColor" stroke-width="2"/>
    <path d="M8 3H5V6M16 21H19V18"
      stroke="currentColor" stroke-width="2"
      stroke-linecap="round"/>
  </svg>
</button>

<script>
let landscapeAktif = false;

const btn = document.getElementById("landscapeBtn");
const icon = document.getElementById("landscapeIcon");

const ikonLandscape = `
<rect x="3" y="6" width="18" height="12" rx="2"
stroke="currentColor" stroke-width="2"/>
<path d="M8 3H5V6M16 21H19V18"
stroke="currentColor" stroke-width="2"
stroke-linecap="round"/>
`;

const ikonNormal = `
<rect x="7" y="3" width="10" height="18" rx="2"
stroke="currentColor" stroke-width="2"/>
<path d="M10 6H14M10 18H14"
stroke="currentColor" stroke-width="1.5"
stroke-linecap="round"/>
`;

async function toggleLandscape() {
  try {
    if (!landscapeAktif) {
      await document.documentElement.requestFullscreen();

      if (screen.orientation?.lock) {
        await screen.orientation.lock("landscape");
      }

      landscapeAktif = true;
      icon.innerHTML = ikonNormal;

    } else {
      screen.orientation?.unlock();

      if (document.fullscreenElement) {
        await document.exitFullscreen();
      }

      landscapeAktif = false;
      icon.innerHTML = ikonLandscape;
    }
  } catch (error) {
    console.log(error);
  }
}

document.addEventListener("fullscreenchange", () => {
  if (!document.fullscreenElement) {
    landscapeAktif = false;
    icon.innerHTML = ikonLandscape;
    screen.orientation?.unlock();
  }
});
</script>
<script src="manifest.js"></script>
<script src="core.js"></script>
<script src="game.js"></script>
</body>
</html>
