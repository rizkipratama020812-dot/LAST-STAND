<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYSTEM BREACHED</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: #000;
    color: #00ff41;
    font-family: 'Courier New', monospace;
    min-height: 100vh;
    overflow: hidden;
  }

  /* Scanline overlay */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      rgba(0, 255, 65, 0.04) 0px,
      rgba(0, 255, 65, 0.04) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events: none;
    z-index: 10;
  }

  /* Efek noise/glitch overlay */
  .glitch-overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9;
    mix-blend-mode: screen;
    background:
      linear-gradient(transparent 50%, rgba(255,0,0,0.03) 50%),
      radial-gradient(circle at 30% 40%, rgba(255,0,0,0.06), transparent 60%);
    animation: flicker 0.12s infinite;
  }

  @keyframes flicker {
    0%   { opacity: 0.7; }
    50%  { opacity: 1; }
    100% { opacity: 0.85; }
  }

  /* Konten tengah layar */
  .container {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    z-index: 5;
  }

  /* Judul glitch */
  .glitch-title {
    font-size: clamp(1.6rem, 6vw, 3rem);
    color: #00ff41;
    position: relative;
    letter-spacing: 6px;
    text-shadow: 0 0 15px #00ff41;
    margin-bottom: 25px;
  }
  .glitch-title::before,
  .glitch-title::after {
    content: attr(data-text);
    position: absolute;
    left: 0; right: 0; top: 0;
  }
  .glitch-title::before {
    color: #ff0000;
    animation: glitch1 1.8s infinite;
    clip-path: inset(0 0 55% 0);
  }
  .glitch-title::after {
    color: #00bfff;
    animation: glitch2 2.3s infinite;
    clip-path: inset(55% 0 0 0);
  }
  @keyframes glitch1 {
    0%, 88%, 100% { transform: translate(0); }
    90% { transform: translate(-3px, 2px); }
    93% { transform: translate(3px, -1px); }
    96% { transform: translate(-2px, -2px); }
  }
  @keyframes glitch2 {
    0%, 86%, 100% { transform: translate(0); }
    89% { transform: translate(3px, -2px); }
    92% { transform: translate(-3px, 1px); }
    95% { transform: translate(2px, 2px); }
  }

  /* Tengkorak */
  .skull {
    font-size: clamp(5rem, 18vw, 10rem);
    color: #ff0000;
    text-shadow: 0 0 25px #ff0000, 0 0 60px #ff0000;
    margin-bottom: 30px;
    animation: pulse 1s infinite alternate;
    line-height: 1;
  }

  /* Peringatan merah */
  .warning {
    border: 2px solid #ff0000;
    color: #ff0000;
    padding: 18px 30px;
    font-size: clamp(0.9rem, 3.5vw, 1.5rem);
    font-weight: bold;
    letter-spacing: 4px;
    text-shadow: 0 0 12px #ff0000;
    animation: pulse 1s infinite alternate;
    background: rgba(255, 0, 0, 0.07);
  }

  @keyframes pulse {
    from { box-shadow: 0 0 5px #ff0000, inset 0 0 5px #ff0000; }
    to   { box-shadow: 0 0 30px #ff0000, inset 0 0 18px #ff0000; }
  }

  /* Teks berkedip bawah */
  .blink-text {
    margin-top: 30px;
    font-size: clamp(0.75rem, 2.5vw, 1rem);
    color: #00ff41;
    letter-spacing: 2px;
    text-shadow: 0 0 8px #00ff41;
    animation: blinkText 1.2s steps(1) infinite;
  }
  @keyframes blinkText { 50% { opacity: 0; } }
</style>
</head>
<body>
<div class="glitch-overlay"></div>

<div class="container">
  <div class="glitch-title" data-text="SYSTEM BREACHED">SYSTEM BREACHED</div>
  <div class="skull">☠</div>
  <div class="warning">⚠ SISTEM TELAH DIRETAS ⚠</div>
  <div class="blink-text">ACCESS GRANTED // ROOT</div>
</div>
</body>
</html>
